<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Terminal</title>
<link rel="stylesheet" href="/serial/static/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1e1e1e; }

  #terminal { display: none; height: 100%; }

  #waiting {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: #888; font-family: sans-serif;
    text-align: center;
  }
  #waiting .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  #waiting .title { font-size: 18px; margin-bottom: 8px; color: #aaa; }
  #waiting .subtitle { font-size: 13px; color: #666; }
  #waiting .pos { font-size: 36px; font-weight: bold; color: #555; margin: 12px 0; }

  .xterm { padding: 4px; }
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
</style>
</head>
<body>
<div id="waiting">
  <div class="icon">&#x231B;</div>
  <div class="title">Serial Terminal</div>
  <div class="subtitle" id="waiting-text">Connecting…</div>
  <div class="pos" id="qpos"></div>
</div>
<div id="terminal"></div>

<script src="/serial/static/xterm.js"></script>
<script src="/serial/static/xterm-addon-fit.js"></script>
<script src="/serial/static/xterm-addon-canvas.js"></script>
<script src="/serial/static/xterm-addon-web-links.js"></script>
<script src="/serial/static/xterm-addon-search.js"></script>
<script>
(function() {
  var SID = sessionStorage.getItem('serial-term-sid');
  if (!SID) {
    SID = Math.random().toString(36).slice(2, 14);
    sessionStorage.setItem('serial-term-sid', SID);
  }

  var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
             + location.host + '/serial/ws?sid=' + encodeURIComponent(SID);

  var waitingEl = document.getElementById('waiting');
  var waitingText = document.getElementById('waiting-text');
  var qposEl = document.getElementById('qpos');
  var terminalEl = document.getElementById('terminal');

  var term = null;
  var fitAddon = null;
  var ws = null;
  var reconnectTimer = null;

  function initTerminal() {
    if (term) return;
    term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      theme: {
        background: '#1e1e1e',
        foreground: '#d4d4d4',
        cursor: '#ffffff',
        selectionBackground: '#264f78',
      },
    });
    // Canvas renders via <canvas> — 10x faster than DOM
    term.loadAddon(new CanvasAddon.CanvasAddon());
    // Auto-detect URLs in terminal output and make them clickable
    term.loadAddon(new WebLinksAddon.WebLinksAddon());
    // Ctrl+Shift+F to search within terminal content
    term.loadAddon(new SearchAddon.SearchAddon());
    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(terminalEl);
    fitAddon.fit();

    term.onData(function(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(data);
      }
    });

    term.onResize(function(size) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', rows: size.rows, cols: size.cols }));
      }
    });

    window.addEventListener('resize', function() { fitAddon.fit(); });
  }

  function showTerminal() {
    waitingEl.style.display = 'none';
    terminalEl.style.display = 'block';
    initTerminal();
    if (term) term.focus();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols }));
    }
  }

  function showWaiting(text, pos) {
    terminalEl.style.display = 'none';
    waitingEl.style.display = 'flex';
    waitingText.textContent = text;
    qposEl.textContent = pos != null ? '#' + pos : '';
  }

  function connect() {
    if (ws && ws.readyState === WebSocket.OPEN) return;

    ws = new WebSocket(WS_URL);

    ws.onmessage = function(ev) {
      if (typeof ev.data !== 'string') return;

      if (ev.data.charCodeAt(0) === 0x7B /* '{' */) {
        try {
          var ctrl = JSON.parse(ev.data);
          if (ctrl.type === 'active') {
            showTerminal();
          } else if (ctrl.type === 'queue') {
            showWaiting('Someone else is using the serial port. You are in the queue.', ctrl.position);
          }
          return;
        } catch (e) { /* fall through */ }
      }

      if (term) term.write(ev.data);
    };

    ws.onclose = function() {
      if (!term) showWaiting('Connection lost. Reconnecting…', null);
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = function() {
      ws.close();
    };
  }

  connect();
})();
</script>
</body>
</html>
