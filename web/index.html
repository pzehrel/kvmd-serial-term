<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Terminal</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1e1e1e; }
  #terminal { height: 100%; }
  #header {
    height: 28px; background: #333; color: #aaa; font: 12px sans-serif;
    display: flex; align-items: center; padding: 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    display: none; /* hidden by default; shown when queued */
  }
  .xterm { padding: 4px; }
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
</style>
</head>
<body>
<div id="header">Serial Terminal — waiting in queue (position <span id="qpos">-</span>)</div>
<div id="terminal"></div>
<script src="/static/xterm.js"></script>
<script src="/static/xterm-addon-fit.js"></script>
<script>
(function() {
  // Session ID persisted in sessionStorage so reconnects reuse the same ID
  var SID = sessionStorage.getItem('serial-term-sid');
  if (!SID) {
    SID = Math.random().toString(36).slice(2, 14);
    sessionStorage.setItem('serial-term-sid', SID);
  }

  var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
             + location.host + '/ws?sid=' + encodeURIComponent(SID);

  var term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: 'Menlo, Monaco, "Courier New", monospace',
    theme: {
      background: '#1e1e1e',
      foreground: '#d4d4d4',
      cursor: '#ffffff',
      selectionBackground: '#264f78',
    },
  });

  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  var header = document.getElementById('header');
  var qpos = document.getElementById('qpos');

  var ws = null;
  var reconnectTimer = null;

  function connect() {
    if (ws && ws.readyState === WebSocket.OPEN) return;

    ws = new WebSocket(WS_URL);

    ws.onopen = function() {
      term.focus();
      ws.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols }));
    };

    ws.onmessage = function(ev) {
      if (typeof ev.data !== 'string') return;

      // Filter JSON control/session messages from terminal output
      if (ev.data.charCodeAt(0) === 0x7B /* '{' */) {
        try {
          var ctrl = JSON.parse(ev.data);
          if (ctrl.type === 'active') {
            header.style.display = 'none';
            term.focus();
          } else if (ctrl.type === 'queue') {
            qpos.textContent = ctrl.position;
            header.style.display = 'flex';
          }
          return; // don't write control JSON to the terminal
        } catch (e) {
          // Not JSON — fall through to write as normal output
        }
      }

      term.write(ev.data);
    };

    ws.onclose = function() {
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = function() {
      ws.close();
    };
  }

  term.onData(function(data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(data);
    }
  });

  term.onResize(function(size) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', rows: size.rows, cols: size.cols }));
    }
  });

  window.addEventListener('resize', function() { fitAddon.fit(); });

  connect();
})();
</script>
</body>
</html>
