[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvmd-serial-term"
version = "0.1.0"
description = "PiKVM serial console extension — control a target machine via USB-TTL serial port through the PiKVM Web UI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0"}
dependencies = [
    "aiohttp>=3.8",
    "pyserial-asyncio>=0.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["kvmd_serial_term*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
